name: Release drift

run-name: Release drift (${{ github.event_name }})

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Exercise the owner notification and acknowledgement path
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-drift-read-only
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || 'false' }}
    steps:
      - name: Check out the reviewed checker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prove the workflow token is read-only
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/effectstream/binaries/releases/tags/0.3.120 --jq '.id' >/dev/null
          probe_ref="refs/heads/actions-readonly-probe-${GITHUB_RUN_ID}"
          set +e
          probe_output="$(gh api -X POST repos/effectstream/binaries/git/refs \
            -f ref="$probe_ref" \
            -f sha="$GITHUB_SHA" 2>&1)"
          probe_rc=$?
          set -e
          if [[ $probe_rc -eq 0 ]]; then
            echo 'ERROR: contents write unexpectedly succeeded; repository owner must remove the probe ref.' >&2
            exit 1
          fi
          grep -F 'Resource not accessible by integration' <<<"$probe_output" >/dev/null
          if gh api "repos/effectstream/binaries/git/ref/heads/actions-readonly-probe-${GITHUB_RUN_ID}" >/dev/null 2>&1; then
            echo 'ERROR: rejected write probe nevertheless created a ref.' >&2
            exit 1
          fi

      - name: Check the complete permanent development release
        shell: bash
        run: |
          set -o pipefail
          scripts/check-release-drift.sh \
            --repo effectstream/binaries --release 0.3.120 \
            --baseline metadata/baselines/0.3.120-current.json \
            2>&1 | tee drift-report.txt

      - name: Retain the non-secret drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-drift-report-${{ github.run_id }}
          path: drift-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Simulate a visible failure
        if: env.SIMULATE_FAILURE == 'true'
        shell: bash
        run: |
          echo 'Owner acknowledgement exercise requested; failing without any repository or release write.' >&2
          exit 42

      - name: Publish owner acknowledgement instructions
        if: always()
        shell: bash
        run: |
          {
            echo '## Release drift heartbeat'
            echo
            echo "- Repository: effectstream/binaries"
            echo "- Release: 0.3.120"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Conclusion: inspect the job conclusion above; the workflow has no write permission."
            echo
            echo "On failure, \`acedward\` acknowledges this run by inspecting the retained summary, records the run ID/time, then follows the docs/PUBLISHING.md enable → dispatch → fresh-success sequence."
          } >>"$GITHUB_STEP_SUMMARY"
